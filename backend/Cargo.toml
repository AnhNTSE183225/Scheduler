[package]
name = "scheduler-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# 1. Asynchronous Core & HTTP Layer
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"

# 2. Database & Persistence (SQLite WAL mode)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# 3. Serialization, Configuration & Validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.15", features = ["yaml"] }
validator = { version = "0.19", features = ["derive"] }

# 4. Telemetry, Tracing & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"

# 5. Networking, Auth & Web Push (VAPID)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
web-push-native = "0.5"
base64ct = { version = "1.6", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2.5"

# 6. Low-overhead Allocator
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
